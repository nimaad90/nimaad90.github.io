<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>مدیریت پورتفولیو</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap">
<style>
:root{--bg:#F2F4F8;--surface:#fff;--ink:#10182B;--muted:#5A6478;--accent:#2F4BFF;--on:#fff;--line:#DCE1EA;--danger:#C62828;--ok:#1B7F3B;
  --font:"Vazirmatn",system-ui,Tahoma,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace}
@media(prefers-color-scheme:dark){:root{--bg:#0D1220;--surface:#151C30;--ink:#E8ECF6;--muted:#93A0BA;--accent:#7C93FF;--on:#0D1220;--line:#263049;--danger:#FF8A80;--ok:#7BE09A}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.8;padding-bottom:6rem}
.wrap{max-width:760px;margin:0 auto;padding:1.25rem}
h1{font-size:1.5rem;font-weight:700;margin-bottom:.25rem}
h2{font-size:1.1rem;font-weight:700;margin-bottom:.75rem}
.muted{color:var(--muted);font-size:.92rem}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1.25rem;margin-top:1rem}
label{display:block;font-size:.9rem;font-weight:500;margin:.8rem 0 .2rem}
input[type=text],input[type=password],textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.5rem .7rem}
textarea{min-height:5rem;resize:vertical}textarea.code{min-height:14rem;font:.85rem/1.6 var(--mono);direction:ltr;text-align:left}
input[dir=ltr]{direction:ltr;text-align:left}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-weight:700;padding:.5rem 1.1rem;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.p{background:var(--accent);color:var(--on);border-color:var(--accent)}
.btn.d{color:var(--danger)}.btn.s{padding:.15rem .7rem;font-size:.85rem;font-weight:500}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:.5rem;margin-top:1rem}
.tabs .btn[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.item{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.6rem 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}.item b{font-weight:500;overflow-wrap:anywhere}
.msg{margin-top:.75rem;font-size:.92rem}.err{color:var(--danger)}.ok{color:var(--ok)}
.bar{position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:.75rem 1.25rem calc(.75rem + env(safe-area-inset-bottom,0px));z-index:5}
.bar .wrap{padding:0;display:flex;justify-content:space-between;align-items:center;gap:1rem}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>مدیریت پورتفولیو</h1>
  <p class="muted">پروژه‌ها و نمونه کدها را اینجا ویرایش کنید. تغییرات مستقیم در فایل projects.json مخزن شما ذخیره می‌شود.</p>

  <div class="box" id="login">
    <h2>اتصال به گیتهاب</h2>
    <label for="owner">نام کاربری گیتهاب</label><input type="text" id="owner" dir="ltr" placeholder="your-username" autocomplete="off">
    <label for="repo">نام مخزن</label><input type="text" id="repo" dir="ltr" placeholder="your-username.github.io" autocomplete="off">
    <label for="token">توکن دسترسی (Personal access token)</label><input type="password" id="token" dir="ltr" placeholder="github_pat_..." autocomplete="off">
    <label style="display:flex;gap:.5rem;align-items:center;font-weight:400"><input type="checkbox" id="remember"> توکن روی همین دستگاه ذخیره شود</label>
    <div class="row" style="margin-top:1rem"><button class="btn p" id="connect">اتصال</button></div>
    <p class="msg" id="login-msg" role="status"></p>
  </div>

  <div id="editor" hidden>
    <div class="row" style="justify-content:space-between;margin-top:1rem">
      <span class="muted" id="who"></span><button class="btn s" id="logout">خروج</button>
    </div>
    <div class="tabs" role="group" aria-label="بخش‌ها">
      <button class="btn" data-t="projects" aria-pressed="true">پروژه‌ها</button>
      <button class="btn" data-t="snippets" aria-pressed="false">نمونه کدها</button>
    </div>
    <div class="box">
      <div class="row" style="justify-content:space-between;margin-bottom:.5rem"><h2 id="list-title" style="margin:0"></h2><button class="btn p s" id="add">افزودن مورد جدید</button></div>
      <div id="list"></div>
    </div>
    <div class="box" id="formbox" hidden>
      <h2 id="form-title"></h2><div id="form"></div>
      <div class="row" style="margin-top:1rem"><button class="btn p" id="apply">ثبت این مورد</button><button class="btn" id="cancel">لغو</button></div>
      <p class="msg err" id="form-msg" role="alert"></p>
    </div>
  </div>
</div>

<div class="bar" id="savebar" hidden><div class="wrap">
  <span class="msg" id="save-msg" style="margin:0" role="status">تغییری ذخیره‌نشده وجود ندارد</span>
  <button class="btn p" id="save">ذخیره در گیتهاب</button>
</div></div>

<script>
const $ = (id) => document.getElementById(id);
const FILE = "projects.json";
const FIELDS = {
  projects: [{k:"title",l:"عنوان پروژه"},{k:"desc",l:"توضیح کوتاه",t:"area"},{k:"tags",l:"برچسب‌ها (با ویرگول جدا کنید)",t:"tags"},
             {k:"demo",l:"لینک نمایش زنده (اختیاری)",ltr:1},{k:"code",l:"لینک کد پروژه (اختیاری)",ltr:1},{k:"featured",l:"کارت بزرگ‌تر نمایش داده شود",t:"bool"}],
  snippets: [{k:"file",l:"نام فایل (مثل sort.js)",ltr:1},{k:"lang",l:"زبان (js، py، css)",ltr:1},{k:"desc",l:"توضیح کوتاه",t:"area"},{k:"code",l:"کد",t:"code"}]
};
const NAMES = { projects: "پروژه‌ها", snippets: "نمونه کدها" };
const enc = (s) => { let x = ""; new TextEncoder().encode(s).forEach(c => x += String.fromCharCode(c)); return btoa(x); };
const dec = (b) => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g, "")), c => c.charCodeAt(0)));

let cfg = {}, data = { projects: [], snippets: [] }, sha = null, tab = "projects", editing = -1, dirty = false;

const gh = (method, body) => fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${FILE}`, {
  method, body: body && JSON.stringify(body),
  headers: { Authorization: "Bearer " + cfg.token, Accept: "application/vnd.github+json", "Content-Type": "application/json" }
});
const say = (id, text, cls) => { const e = $(id); e.textContent = text; e.className = "msg " + (cls || ""); };
function setDirty(v) {
  dirty = v; $("save-msg").textContent = v ? "تغییرهای ذخیره‌نشده دارید" : "همه چیز ذخیره شده است";
}

// اتصال
try { const s = JSON.parse(localStorage.getItem("admin-cfg") || "{}"); $("owner").value = s.owner || ""; $("repo").value = s.repo || ""; $("token").value = s.token || ""; $("remember").checked = !!s.token; } catch (e) {}
$("connect").onclick = async () => {
  cfg = { owner: $("owner").value.trim(), repo: $("repo").value.trim(), token: $("token").value.trim() };
  if (!cfg.owner || !cfg.repo || !cfg.token) return say("login-msg", "نام کاربری، نام مخزن و توکن را وارد کنید.", "err");
  say("login-msg", "در حال اتصال…");
  try {
    const r = await gh("GET");
    if (r.status === 401) return say("login-msg", "توکن قبول نشد. آن را دوباره کپی کنید یا توکن تازه بسازید.", "err");
    if (r.status === 403) return say("login-msg", "این توکن اجازه دسترسی ندارد. بخش Contents باید روی Read and write باشد.", "err");
    if (r.status === 404) { sha = null; data = { projects: [], snippets: [] }; }
    else if (r.ok) { const j = await r.json(); sha = j.sha; const d = JSON.parse(dec(j.content)); data = { projects: d.projects || [], snippets: d.snippets || [] }; }
    else return say("login-msg", "اتصال انجام نشد (کد " + r.status + ").", "err");
  } catch (e) { return say("login-msg", "ارتباط با گیتهاب برقرار نشد. اینترنت را بررسی کنید.", "err"); }
  try { localStorage.setItem("admin-cfg", JSON.stringify({ owner: cfg.owner, repo: cfg.repo, token: $("remember").checked ? cfg.token : "" })); } catch (e) {}
  $("login").hidden = true; $("editor").hidden = false; $("savebar").hidden = false;
  $("who").textContent = `${cfg.owner}/${cfg.repo}`; setDirty(false); render();
};
$("logout").onclick = () => { if (dirty && !confirm("تغییرهای ذخیره‌نشده از بین می‌روند. خارج شوید؟")) return; location.reload(); };

// لیست
const label = (it) => (tab === "projects" ? it.title : it.file) || "(بدون نام)";
function render() {
  $("list-title").textContent = NAMES[tab];
  document.querySelectorAll(".tabs .btn").forEach(b => b.setAttribute("aria-pressed", b.dataset.t === tab));
  const L = data[tab];
  $("list").innerHTML = L.length ? L.map((it, i) => `<div class="item"><b>${esc(label(it))}</b><span class="row">
    <button class="btn s" data-a="up" data-i="${i}" aria-label="بالا">▲</button><button class="btn s" data-a="down" data-i="${i}" aria-label="پایین">▼</button>
    <button class="btn s" data-a="edit" data-i="${i}">ویرایش</button><button class="btn s d" data-a="del" data-i="${i}">حذف</button></span></div>`).join("")
    : `<p class="muted">هنوز موردی اضافه نشده. «افزودن مورد جدید» را بزنید.</p>`;
}
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
document.querySelectorAll(".tabs .btn").forEach(b => b.onclick = () => { tab = b.dataset.t; closeForm(); render(); });
$("list").onclick = (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const i = +b.dataset.i, L = data[tab];
  if (b.dataset.a === "edit") openForm(i);
  if (b.dataset.a === "del" && confirm(`«${label(L[i])}» حذف شود؟`)) { L.splice(i, 1); setDirty(true); render(); }
  if (b.dataset.a === "up" && i > 0) { [L[i - 1], L[i]] = [L[i], L[i - 1]]; setDirty(true); render(); }
  if (b.dataset.a === "down" && i < L.length - 1) { [L[i + 1], L[i]] = [L[i], L[i + 1]]; setDirty(true); render(); }
};

// فرم
function openForm(i) {
  editing = i; const it = i > -1 ? data[tab][i] : {};
  $("form-title").textContent = (i > -1 ? "ویرایش " : "افزودن ") + (tab === "projects" ? "پروژه" : "نمونه کد");
  $("form").innerHTML = FIELDS[tab].map(f => {
    const v = it[f.k], id = "f_" + f.k;
    if (f.t === "bool") return `<label style="display:flex;gap:.5rem;align-items:center;font-weight:400"><input type="checkbox" id="${id}" ${v ? "checked" : ""}> ${f.l}</label>`;
    if (f.t === "area") return `<label for="${id}">${f.l}</label><textarea id="${id}">${esc(v || "")}</textarea>`;
    if (f.t === "code") return `<label for="${id}">${f.l}</label><textarea class="code" id="${id}" spellcheck="false">${esc(v || "")}</textarea>
      <label for="pick" style="font-weight:400">یا از یک فایل روی کامپیوتر بخوانید:</label><input type="file" id="pick">`;
    return `<label for="${id}">${f.l}</label><input type="text" id="${id}" ${f.ltr ? 'dir="ltr"' : ""} value="${esc(f.t === "tags" ? (v || []).join("، ") : v || "")}">`;
  }).join("");
  const pick = $("pick");
  if (pick) pick.onchange = async () => { const f = pick.files[0]; if (f) { $("f_code").value = await f.text(); if (!$("f_file").value) $("f_file").value = f.name; } };
  say("form-msg", ""); $("formbox").hidden = false; $("formbox").scrollIntoView({ behavior: "smooth" });
}
function closeForm() { $("formbox").hidden = true; editing = -1; }
$("add").onclick = () => openForm(-1);
$("cancel").onclick = closeForm;
$("apply").onclick = () => {
  const it = {};
  for (const f of FIELDS[tab]) {
    const el = $("f_" + f.k);
    const v = f.t === "bool" ? el.checked : f.t === "tags" ? el.value.split(/[,،]/).map(s => s.trim()).filter(Boolean) : el.value.trim();
    if (f.t === "code" ? v : (v && (!Array.isArray(v) || v.length))) it[f.k] = v;
  }
  const req = tab === "projects" ? "title" : "file";
  if (!it[req]) return say("form-msg", tab === "projects" ? "عنوان پروژه را وارد کنید." : "نام فایل را وارد کنید.", "err");
  if (tab === "projects" && !it.tags) it.tags = [];
  if (editing > -1) data[tab][editing] = it; else data[tab].push(it);
  setDirty(true); closeForm(); render();
};

// ذخیره
$("save").onclick = async () => {
  say("save-msg", "در حال ذخیره…");
  try {
    const r = await gh("PUT", { message: "Update portfolio from admin page", content: enc(JSON.stringify(data, null, 2)), ...(sha ? { sha } : {}) });
    if (r.ok) { sha = (await r.json()).content.sha; setDirty(false); say("save-msg", "ذخیره شد. تا یکی دو دقیقه دیگر روی سایت دیده می‌شود.", "ok"); }
    else if (r.status === 409 || r.status === 422) say("save-msg", "فایل در گیتهاب تغییر کرده. صفحه را رفرش و دوباره وصل شوید.", "err");
    else say("save-msg", "ذخیره نشد (کد " + r.status + "). دسترسی توکن را بررسی کنید.", "err");
  } catch (e) { say("save-msg", "ارتباط با گیتهاب برقرار نشد.", "err"); }
};
addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
</script>
</body>
</html>
